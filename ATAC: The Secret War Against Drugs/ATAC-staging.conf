# This is the configuration file for ATAC: The Secret War on Drugs.

[cpu]
cpu_cycles = 25000
cycleup = 500
cycledown = 500

[voodoo]
voodoo = off

[mixer]
reverb = small
chorus = light

[mt32]
model = cm32l
romdir = "D:\Midi\Versioned"

[midi]
mididevice = mt32

[joystick]
joysticktype = ch
timed = off
swap34 = on
deadzone = 0

[autoexec]
@echo off
mount c "D:\Games\Dos\ATAC\hdd"
# mount a "D:\Games\Dos\ATAC\fdd\*.ima" -t floppy
# mount d "D:\Games\Dos\ATAC\cd\ATAC.iso" -t cdrom
mixer master 100 /noshow
c:
cd atac
call atac.bat
pause
exit
