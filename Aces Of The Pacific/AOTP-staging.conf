# This is the configuration file for Aces Of The Pacific.

[cpu]
cpu_cycles = 20000
cycleup = 500
cycledown = 500

[voodoo]
voodoo = off

[mixer]
reverb = small
chorus = light

[mt32]
model = mt32_old
romdir = "D:\Midi\Versioned"

[midi]
mididevice = mt32

[joystick]
joysticktype = 4axis
timed = off
swap34 = on
deadzone = 0

[autoexec]
@echo off

# Example hdd folder
# mount c "D:\Games\Dos\Aces Of The Pacific\hdd"

# Example floppy disk mount
# mount a "D:\Games\Dos\Aces Of The Pacific\fdd\*.img" -t floppy

# Example CD-ROM mount
# mount d "D:\Games\Dos\Aces Of The Pacific\cd\Aces of the Pacific.iso" -t cdrom

mixer master 100 /noshow
c:

# Running a floppy release
# cd \dynamix
# call aces.bat
# exit

# Running a cd release
# cd \dynamix\aotp
# call aotpcd.bat
# exit

# Running a compilation release
# cd \sierra\aotp
# cd \sierra\aces\aotp
# call aotpcd.bat
# exit

# Using the AOTP menu
# cd \dynamix\aotp
# cd \sierra\aotp
# cd \sierra\aces\aotp
# call aotpmenu.bat
