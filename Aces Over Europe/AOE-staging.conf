# This is the configuration file for Aces Over Europe.

[cpu]
cpu_cycles = 30000
cycleup = 500
cycledown = 500

[voodoo]
voodoo = off

[mixer]
reverb = small
chorus = light

[mt32]
model = mt32_old
romdir = "D:\Midi\Versioned"

[midi]
mididevice = mt32

[joystick]
joysticktype = ch
timed = off
swap34 = on
deadzone = 0

[autoexec]
@echo off

# hdd folder
mount c "D:\Games\Dos\Aces Over Europe\hdd"

# Example floppy disk mount
# mount a "D:\Games\Dos\Aces Over Europe\fdd\*.img" -t floppy

# Example CD-ROM mount
# mount d "D:\Games\Dos\Aces Over Europe\cd\Aces over Europe.iso" -t cdrom

mixer master 100 /noshow
c:

# Running a floppy release
# cd \dynamix
# call aoe.bat
# exit

# Running a cd release
# cd \dynamix\aoe
# call aoecd.bat
# exit

# Running a compilation release
# cd \sierra\aoe
# cd \sierra\aces\aoe
# call aoecd.bat
# exit

# Using the AOE menu
# cd \dynamix\aoe
# cd \sierra\aoe
# cd \sierra\aces\aoe
# call aoemenu.bat
