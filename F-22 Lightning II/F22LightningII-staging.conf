# This is the configuration file for F22 Lightning II.

[cpu]
cpu_cycles_protected = 200000
cpu_throttle = on
cycleup = 1000
cycledown = 1000

[voodoo]
voodoo = off

[mixer]
reverb = medium
chorus = normal

[soundcanvas]
soundcanvas_model = auto
soundcanvas_rom_dir = "D:\Midi\soundcanvas\ROMs"

[midi]
mididevice = soundcanvas

[joystick]
joysticktype = ch
timed = off
swap34 = on
deadzone = 0

[autoexec]
@echo off
mount c "D:\Games\Dos\F-22 Lightning II\hdd"
mount d "D:\Games\Dos\F-22 Lightning II\cd\F-22 Lightning II.cue" -t cdrom
mixer master 100 /noshow
c:

# Running F-22
# cd f22
# f22.exe
# exit

# Using the F22 menu
# call f22menu.bat
