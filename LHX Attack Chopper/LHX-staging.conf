# This is the configuration file for LHX: Attack Chopper.

[cpu]
core = simple
cputype = 386
cpu_cycles = 6000
cycleup = 100
cycledown = 100

[voodoo]
voodoo = off

[mixer]
reverb = small
chorus = light

[sblaster]
sbtype = none
oplmode = opl2

[joystick]
joysticktype = 2axis
timed = false
deadzone = 0

[autoexec]
@echo off
mount c "D:\Games\Dos\LHX Attack Chopper\hdd"

# Example fdd mount
# mount a "D:\Games\Dos\LHX Attack Chopper\fdd\LHX.img" -t floppy

# Example CD-ROM mount
# mount d "D:\Games\Dos\LHX Attack Chopper\cd\LHX.iso" -t cdrom

mixer master 100 /noshow
c:

# Running LHX
# cd lhx
# call start.bat
# exit

# LHX menu
# call lhxmenu.bat
