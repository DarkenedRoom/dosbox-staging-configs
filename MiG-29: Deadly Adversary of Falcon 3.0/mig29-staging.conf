# This is the configuration file for MiG-29: Deadly Adversary of Falcon 3.0 (standalone edition).

[cpu]
core = simple
cpu_cycles = 20000
cycleup = 250
cycledown = 250

[voodoo]
voodoo = off

[mixer]
reverb = medium
chorus = normal

[mt32]
model = cm32l
romdir = "D:\Midi\Versioned"

[midi]
mididevice = mt32

[joystick]
joysticktype = ch
timed = off
swap34 = on
deadzone = 0

[autoexec]
@echo off
mount c "D:\Games\Dos\MiG-29 standalone\hdd"

# Example floppy disk mount
mount a "D:\Games\Dos\MiG-29 standalone\fdd\*.img" -t floppy

# Example cd mount
mount d "D:\Games\Dos\MiG-29 standalone\cd\mig29.iso" -t cdrom

c:
cd mig29
mig29.exe  
