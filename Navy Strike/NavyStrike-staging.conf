# DOSBox Staging config for Navy Strike: Task Force Command

[sdl]
fullscreen = on

[dosbox]
machine = svga_s3
memsize = 31

[cpu]
cpu_cycles = 62500
cpu_cycles_protected = auto
cycleup = 500
cycledown = 500

[voodoo]
voodoo = off

[mixer]
reverb = small
chorus = light

[mt32]
model = cm32l
romdir = "D:\Midi\Versioned"

[midi]
mididevice = mt32

[joystick]
joysticktype = ch
timed = on
swap34 = true
deadzone = 0

[autoexec]
@echo off

# Example hdd mount
mount c "D:\Games\dos\Navy Strike\hdd"

# Example cd mounts
# mount d "D:\Games\dos\Navy Strike\cd\Navy Strike.cue" -t cdrom
# mount d "D:\Games\dos\Navy Strike\cd\Navy Strike.iso" -t cdrom

c:

# Starting the game
# cd strike
# strike
# exit

# Starting the launcher menu
# call navymenu.bat
