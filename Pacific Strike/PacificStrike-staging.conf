# This is the configuration file for Pacific Strike.

[sdl]
fullscreen = on

[dosbox]
memsize = 63

[cpu]
core = dynamic
cpu_cycles = 35000
cpu_cycles_protected = auto
cycleup = 500
cycledown = 500

[voodoo]
voodoo = off

[mixer]
reverb = small
chorus = light

[mt32]
model = mt32_old
romdir = "D:\Midi\Versioned"

[fluidsynth]
soundfont = "Shan SGM Pro 15.SF2"
soundfont_dir = "D:\Midi\Soundfonts"

[soundcanvas]
soundcanvas_model = auto
soundcanvas_rom_dir = "D:\Midi\soundcanvas\ROMs"

[midi]
mididevice = soundcanvas
midiconfig = 0

[joystick]
joysticktype = ch
timed = off
swap34 = on
deadzone = 0

[autoexec]
@echo off

# Example hdd folder mount
mount c "D:\Games\Dos\Pacific Strike\hdd"

# Example floppy disk mount
# mount a "D:\Games\Dos\Pacific Strike\fdd\*.img" -t floppy

c:

# Running the game
# cd ps
# pacific
# pause
# exit

# Running the launcher
# call psmenu.bat
