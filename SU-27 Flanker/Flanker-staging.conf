# This is the configuration file for SU-27 Flanker.

[sdl]
fullscreen = on

[cpu]
cpu_cycles = 60000
cpu_cycles_protected = auto
cycleup = 1000
cycledown = 1000

[voodoo]
voodoo = off

[mixer]
reverb = small
chorus = light

[joystick]
joysticktype = ch
timed = off
swap34 = on
deadzone = 0

[autoexec]
@echo off

# Example hdd mount
mount c "D:\Games\Dos\SU-27 Flanker\hdd"

# Example 1996/1997 CD-ROM mount
mount d "D:\Games\Dos\SU-27 Flanker\cd\Flanker.iso" -t cdrom

# Example SCE folder mount
# mount d "D:\Games\Dos\SU-27 Flanker\cd\v1.1" -t cdrom -label FLANKER

c:

# Runnning the game
# cd su27
# su27dos
# exit

# Running the launcher menu
# call su27menu.bat
