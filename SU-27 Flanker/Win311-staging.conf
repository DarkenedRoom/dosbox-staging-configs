# Configuration file for SU-27 Falnker and Windows 3.x.

[sdl]
fullscreen = on

[render]
integer_scaling = off
shader = sharp

[dosbox]
vmemsize = 4

[cpu]
cputype = pentium
cpu_cycles = 40000
cycleup = 1000
cycledown = 1000

[voodoo]
voodoo = off

[mouse]
builtin_dos_mouse_driver_options = immediate

[mixer]
reverb = small
chorus = light

[midi]
mididevice = port
midiconfig = 0

[autoexec]
@echo off

# Unmount any existing c: drive
mount -u c

# C: drive with Windows 3.x
mount c "D:\Games\Dos\SU-27 Flanker\hdd"

# Flanker CD-ROM
mount d "D:\Games\Dos\SU-27 Flanker\cd\v1.1" -t cdrom -label FLANKER

set path=%path%;c:\windows;
c:
win
exit