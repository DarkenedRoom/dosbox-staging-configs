# Configuration file for Windows 3.x.

[dosbox]
vmemsize = 4

[cpu]
cputype = pentium
cpu_cycles = 40000
cycleup = 1000
cycledown = 1000

[voodoo]
voodoo = off

[mouse]
builtin_dos_mouse_driver_options = immediate

[mixer]
reverb = small
chorus = light

[midi]
mididevice = port
midiconfig = 0

[autoexec]
@echo off

# Unmount any existing c: drive
mount -u c

# C: drive with Windows 3.x
mount c "D:\Games\Dos\Windows for Workgroups 3.11\hdd"

set path=%path%;c:\windows;
c:
win
exit
