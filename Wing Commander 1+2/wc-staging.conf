# This is the DOSBox Staging 0.83.0 configuration for Wing Commander 1+2 using the WCAT Overhaul mod.

[sdl]
fullscreen	= on

[dosbox]
memsize	= 8
vmemsize = 1

[render]
integer_scaling	= off

[cpu]
cpu_cycles = 22000

[voodoo]
voodoo = off

[mouse]
mouse_capture = onstart

[mt32]
model = mt32_old
romdir = "D:\Midi\Versioned"

[midi]
mididevice = mt32

[sblaster]
sbtype = sbpro2

[joystick]
timed = off
deadzone = 0

[dos]
ems	= on
ver	= 6.22

[autoexec]
@echo off
mount C "D:\Games\Dos\Wing Commander 1+2\hdd"
mixer master 100 /noshow
loadfix -32
c:
cls
call wcatmenu.bat
